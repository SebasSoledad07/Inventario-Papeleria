spring.application.name=inventario-papeleria

# Base de datos (claves solo por variables de entorno, ver .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/papeleria_db}
spring.datasource.username=${DB_USUARIO:app_papel}
spring.datasource.password=${DB_CLAVE:Sebaslol943*}

# JPA: nunca generar el esquema desde las entidades (RNF-07), solo validar
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: migraciones versionadas en db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Fechas solo en America/Bogota (RN-39), en Hibernate y Jackson
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota